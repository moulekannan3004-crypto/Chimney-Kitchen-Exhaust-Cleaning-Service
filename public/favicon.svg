<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Hood & Canopy Gold/Orange Gradient -->
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Airflow / Spark Teal/Emerald Gradient -->
    <linearGradient id="airGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background Shield Shape -->
  <path d="M256 32 C370 32, 440 60, 440 60 V240 C440 360, 340 440, 256 480 C172 440, 72 360, 72 240 V60 C72 60, 142 32, 256 32 Z" fill="url(#shieldBg)" stroke="url(#shieldBorder)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Chimney Stack & Flue Riser Base -->
  <rect x="216" y="100" width="80" height="70" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
  <!-- Chimney Cap Top -->
  <path d="M196 100 H316 L300 80 H212 Z" fill="#64748b"/>

  <!-- Commercial Exhaust Hood Canopy Trapeze -->
  <path d="M140 230 L180 170 H332 L372 230 C372 230, 360 250, 256 250 C152 250, 140 230, 140 230 Z" fill="url(#hoodGrad)" stroke="#ffedd5" stroke-width="4"/>
  
  <!-- Exhaust Hood Filters / Stainless Baffles -->
  <line x1="200" y1="230" x2="220" y2="185" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <line x1="240" y1="230" x2="252" y2="185" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <line x1="280" y1="230" x2="284" y2="185" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <line x1="312" y1="230" x2="316" y2="185" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Clean Airflow Vortices & Degreasing Sweeps (Dynamic Curves) -->
  <path d="M130 310 C 180 260, 220 340, 280 290 C 330 250, 380 280, 400 260" fill="none" stroke="url(#airGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M110 360 C 160 310, 210 390, 290 330 C 340 290, 370 330, 390 310" fill="none" stroke="url(#airGrad)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

  <!-- Spark / Fire-Safety Clean Star -->
  <path d="M256 340 L266 370 L296 380 L266 390 L256 420 L246 390 L216 380 L246 370 Z" fill="#fef08a"/>
  <circle cx="256" cy="380" r="6" fill="#ffffff"/>

  <!-- Sparkle Accent 1 -->
  <path d="M340 370 L345 385 L360 390 L345 395 L340 410 L335 395 L320 390 L335 385 Z" fill="#38bdf8" opacity="0.9"/>
  <!-- Sparkle Accent 2 -->
  <path d="M170 370 L174 382 L186 386 L174 390 L170 402 L166 390 L154 386 L166 382 Z" fill="#f97316" opacity="0.9"/>
</svg>